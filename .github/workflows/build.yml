name: build
on:
  push: { branches: [main], tags: ['v*'] }
  pull_request:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 8.0.x }
      - name: Self-test (ядро)
        run: dotnet run --project tests/SDModLoader.SelfTest
      - name: Publish portable exe
        run: >
          dotnet publish src/SDModLoader.App -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o dist
      - uses: actions/upload-artifact@v4
        with: { name: SDModLoader-win-x64, path: dist/SDModLoader.exe }
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with: { files: dist/SDModLoader.exe }
